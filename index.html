  <body class="bg-white text-slate-900 antialiased selection:bg-amber-400 selection:text-slate-950">
    <!-- Persistent Firebase Phone Auth reCAPTCHA Container (Never unmounted by React) -->
    <div id="recaptcha-container"></div>
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#FFFFFF;">
        <div style="width:48px;height:3px;background:rgba(70,103,77,0.15);border-radius:999px;overflow:hidden;position:relative;">
          <div style="width:50%;height:100%;background:#46674D;border-radius:999px;animation:aqqarPreloadPulse 1s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes aqqarPreloadPulse {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration (Web only, bypass for Capacitor native iOS) -->
    <script>
      const isCapacitor = window.location.protocol === 'capacitor:' || 
                          window.location.protocol === 'ionic:' || 
                          window.location.protocol === 'file:' ||
                          Boolean(window.Capacitor);
      if (!isCapacitor && 'serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
        const isDev = window.location.hostname.includes('ais-dev') || 
                      window.location.hostname.includes('localhost') || 
                      window.location.hostname === '127.0.0.1';
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (const r of regs) r.unregister();
          }).catch(() => {});
          if ('caches' in window) {
            caches.keys().then(names => {
              for (const n of names) caches.delete(n);
            }).catch(() => {});
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('AQQAR Service Worker registered successfully:', reg.scope))
              .catch(err => console.log('AQQAR Service Worker registration failed:', err));
          });
        }
      }
    </script>
