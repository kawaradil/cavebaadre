<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Tile Gradient harmonized with app palette (#46674D & #1E3725) -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46674D" />
      <stop offset="50%" stop-color="#2D4833" />
      <stop offset="100%" stop-color="#1E3725" />
    </linearGradient>

    <!-- Main Front Facet: Crisp Rich Architectural Green -->
    <linearGradient id="towerFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2F0E5" />
      <stop offset="35%" stop-color="#A8D5B1" />
      <stop offset="100%" stop-color="#5B8764" />
    </linearGradient>

    <!-- Side Perspective Facet: Lighter Dimension for 3D Depth -->
    <linearGradient id="towerFacet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#C5E6CE" />
      <stop offset="100%" stop-color="#7EAB87" />
    </linearGradient>

    <!-- Glass Windows: Bright crystalline reflections -->
    <linearGradient id="towerWindows" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0F2E5" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="iconSoftShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0E1B12" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer App Tile (Harmonized with app theme #46674D & #1E3725) -->
  <rect width="512" height="512" rx="112" fill="url(#iconBgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3" />

  <!-- Subtle Top Glass Sheen -->
  <path d="M 0 112 C 0 50 45 0 112 0 L 400 0 C 467 0 512 50 512 112 L 512 215 Q 256 265 0 215 Z" fill="rgba(255,255,255,0.08)" />

  <!-- Center Startup Logo Architecture (Matching Splash Logo Exactly) -->
  <g transform="translate(76, 75) scale(2.25)" filter="url(#iconSoftShadow)">
    <!-- Left Tower Facade -->
    <path d="M 25 75 L 25 35 L 50 25 L 50 75 Z" fill="url(#towerFacet1)" />
    <!-- Left Tower Side Wall -->
    <path d="M 50 25 L 65 30 L 65 75 L 50 75 Z" fill="url(#towerFacet2)" opacity="0.9" />

    <!-- Center Main Skyscraper (Tallest with Perspective Apex) -->
    <path d="M 68 75 L 68 15 L 95 8 L 95 75 Z" fill="url(#towerFacet1)" />
    <!-- Center Skyscraper Side Wall -->
    <path d="M 95 8 L 115 18 L 115 75 L 95 75 Z" fill="url(#towerFacet2)" />

    <!-- Windows On Center Tower -->
    <rect x="76" y="22" width="5" height="8" rx="1.2" fill="url(#towerWindows)" />
    <rect x="85" y="22" width="5" height="8" rx="1.2" fill="url(#towerWindows)" />
    <rect x="76" y="36" width="5" height="8" rx="1.2" fill="url(#towerWindows)" />
    <rect x="85" y="36" width="5" height="8" rx="1.2" fill="url(#towerWindows)" />
    <rect x="76" y="50" width="5" height="8" rx="1.2" fill="url(#towerWindows)" />
    <rect x="85" y="50" width="5" height="8" rx="1.2" fill="url(#towerWindows)" />

    <!-- Right Modern Commercial Building Facet -->
    <path d="M 118 75 L 118 30 L 138 40 L 138 75 Z" fill="url(#towerFacet2)" />
  </g>

  <!-- Main Brand Title: AQQAR -->
  <text
    x="256"
    y="326"
    font-family="'Montserrat', 'Cairo', -apple-system, sans-serif"
    font-weight="900"
    font-size="64"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="12"
  >AQQAR</text>

  <!-- Subtitle: REAL ESTATE -->
  <text
    x="256"
    y="376"
    font-family="'Montserrat', 'Noto Kufi Arabic', -apple-system, sans-serif"
    font-weight="700"
    font-size="20"
    fill="#D5EFE0"
    text-anchor="middle"
    letter-spacing="6"
  >REAL ESTATE</text>

  <!-- Accent Sheen Line -->
  <rect x="206" y="405" width="100" height="4" rx="2" fill="#A8D5B1" opacity="0.8" />
</svg>